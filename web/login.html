<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录工作台</title><link rel="stylesheet" href="/account.css"><script src="/account.js" defer></script></head>
<body class="account-page"><main class="account-shell"><section class="account-intro"><span class="account-kicker">个人工作空间</span><h1 id="software-name">登录工作台</h1><p>保存运行结果，查看自己的任务与实验记录。</p><div class="account-note">注册后建立个人工作区。每次运行的参数、结果和操作记录都保存在服务器，换台电脑登录也能继续查看。</div><p class="account-mode" id="mode-note"></p></section><section class="account-card"><div class="account-tabs" role="tablist" aria-label="账户操作"><button id="login-tab" role="tab" aria-selected="true">登录</button><button id="register-tab" role="tab" aria-selected="false">注册</button></div><h2 id="form-title">进入你的工作台</h2><form id="auth-form"><label>用户名<input id="username" name="username" required minlength="3" maxlength="32" autocomplete="username" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{2,31}" placeholder="字母、数字、下划线或短横线"></label><label id="display-row" hidden>显示名称<input id="display-name" name="display_name" maxlength="40" autocomplete="nickname" placeholder="你希望界面显示的名字"></label><label>密码<input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"></label><label id="confirm-row" hidden>确认密码<input id="password-confirm" type="password" maxlength="128" autocomplete="new-password"></label><p id="password-hint" hidden>至少12个字符，避免使用常见密码、纯数字或用户名。</p><div id="auth-status" role="status" aria-live="polite"></div><button id="submit-auth" class="account-primary" type="submit">登录</button></form><p class="account-help">忘记密码时联系本站管理员。管理员可重置密码，无法读取原密码。</p></section></main></body></html>
