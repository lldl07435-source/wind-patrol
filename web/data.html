<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的数据</title><link rel="stylesheet" href="/account.css"><script src="/session.js" defer></script><script src="/account.js" defer></script></head><body class="account-page"><main class="data-shell"><a href="/" class="account-back">返回工作台</a><header class="data-heading"><div><span class="account-kicker">个人数据管理</span><h1>我的数据</h1><p id="data-capacity">正在读取工作区…</p></div><a class="account-primary" id="workspace-export" href="/api/account/export" download="my-workspace.zip">导出我的工作区</a></header><div id="collections" class="data-collections"></div><section class="account-card"><form id="search-form" class="data-search"><label for="data-search">查找任务</label><input id="data-search" maxlength="80" placeholder="名称、编号或日期"><button type="submit">查询</button></form><p id="record-count"></p><div class="data-table"><table><thead><tr><th>任务 / 编号</th><th>保存时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="data-rows"></tbody></table></div><p id="data-status" role="status" aria-live="polite"></p></section><div class="data-bottom"><section class="account-card"><h2>修改密码</h2><form id="password-form"><input id="password-username" name="username" autocomplete="username" hidden><label>当前密码<input id="current-password" type="password" required autocomplete="current-password" maxlength="128"></label><label>新密码<input id="new-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="account-primary" type="submit">保存新密码</button><p id="password-status" role="status"></p></form></section><section class="account-card"><h2>近期操作</h2><ul id="audit-events"></ul></section></div></main></body></html>
