name: Multiuser verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python tests/软件验证测试.py
      - run: python tests/场景回归记录.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify_twin_timeline.mjs
      - run: python manage.py test portal
